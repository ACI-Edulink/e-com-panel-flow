<style>

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{background:var(--surface);border-top:4px solid var(--brand);padding:14px 20px 10px;border-bottom:1px solid var(--line)}

header p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.tabs{display:flex;gap:4px;padding:10px 20px 0;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:none;background:none;color:var(--ink2);padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit;font-weight:600}
.tab:hover{background:var(--bg)}

.main{padding:14px 20px;min-width:0}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.intro h2{margin:0 0 3px;font-size:16px}
.intro p{margin:0;color:var(--ink2);font-size:13px;line-height:1.45}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{color:#fff;opacity:.9}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:18px;height:12px;border:1.5px solid;border-radius:3px;display:inline-block}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 290px);min-height:380px}
aside{border-left:1px solid var(--line);background:var(--surface);padding:16px;overflow:auto;max-height:calc(100vh - 150px);position:sticky;top:0}
aside h3{margin:0 0 4px;font-size:16px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;margin-right:4px}
.b-note{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.b-sug{background:var(--sug-bg);color:var(--sug-bd);border:1px solid var(--sug-bd)}

aside ul{padding-left:18px;margin:4px 0}
.qbox{background:var(--sug-bg);border-left:3px solid var(--sug-bd);padding:6px 10px;border-radius:4px;font-size:13px;margin-top:8px}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
/* svg */
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.node{cursor:pointer}
.node .shape{stroke-width:1.6;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.12))}
.t-proc .shape{fill:var(--proc-bg);stroke:var(--proc-bd)}

.sub{fill:var(--ink2);font-size:11px}

.tag rect{fill:var(--sug-bd)}

.lpb circle{fill:var(--loop)}
.lpb text{fill:#fff;font-size:11px;font-weight:700}
.edge path{fill:none;stroke:var(--ink2);stroke-width:1.5}
.edge.loop path{stroke:var(--loop);stroke-dasharray:6 4}
.edge.e-sug:not(.loop) path{stroke:var(--sug-bd);stroke-dasharray:2 4;stroke-width:1.8}
.edge.hi path{stroke-width:2.8}
.edge .el rect{fill:var(--surface);stroke:var(--line)}
.edge .el text{fill:var(--ink2);font-size:10.5px}
.edge.loop .el text{fill:var(--loop)}
.edge.loop .el rect{stroke:var(--loop)}
.lane{fill:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.notes-only .src-sug,.notes-only .edge.e-sug{opacity:.13}
#mAr{fill:var(--ink2)}#mAl{fill:var(--loop)}#mAs{fill:var(--sug-bd)}

.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:4px 0;color:var(--ink2);line-height:1.5;font-size:13px}
.row{display:grid;grid-template-columns:48px 1fr 150px;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.sev{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;text-align:center}
.sev.High{background:var(--brand-soft);color:var(--loop)}.sev.Med{background:var(--sug-bg);color:var(--sug-bd)}.sev.Low{background:var(--bg);color:var(--ink2)}
select,textarea{font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;width:100%}
textarea{min-height:44px;resize:vertical}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px}
.chip.x{border-color:var(--loop);color:var(--loop)}
.fl{font-size:12px;color:var(--muted)}
.qrow{padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:none}
.qrow b{font-size:13px}
.mm-node{cursor:pointer}
.mm-node rect{stroke-width:1.5;fill:var(--surface);stroke:var(--proc-bd)}
.mm-node.d0 rect{fill:var(--brand);stroke:var(--brand)}
.mm-node.d0 text{fill:#fff;font-weight:700}
.mm-node.d1 rect{fill:var(--dec-bg);stroke:var(--dec-bd)}
.mm-node.sug rect{fill:var(--sug-bg);stroke:var(--sug-bd);stroke-dasharray:5 3}
.mm-node text{fill:var(--ink);font-size:12.5px}
.mm-node .pm{fill:var(--muted);font-size:11px}
.mm-link{fill:none;stroke:var(--line);stroke-width:2}
aside.hide{display:none}.wrap.noside{grid-template-columns:1fr}
@media(max-width:980px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none;border-left:none;border-top:1px solid var(--line)}.row{grid-template-columns:1fr}}
@media print{.tabs,.toolbar,aside,.legend,.noprint{display:none!important}.wrap{display:block}.canvas{max-height:none;overflow:visible}body{background:#fff}}
</style>
</head>

function portPt(n,p,o=0){const x=n.cx-n.w/2;switch(p){case"t":return{x:n.cx+o,y:n.y};case"b":return{x:n.cx+o,y:n.y+n.h};case"l":return{x:x,y:n.y+n.h/2+o};default:return{x:x+n.w,y:n.y+n.h/2+o}}}
function route(s,e,fp,tp,via){
  if(via&&via.length)return[s,...via,e];
  if(s.x===e.x||s.y===e.y)return[s,e];
  const fv=fp==="t"||fp==="b",tv=tp==="t"||tp==="b";
  if(fv&&tv){const my=(s.y+e.y)/2;return[s,{x:s.x,y:my},{x:e.x,y:my},e]}
  if(!fv&&!tv){const mx=(s.x+e.x)/2;return[s,{x:mx,y:s.y},{x:mx,y:e.y},e]}
  if(fv&&!tv)return[s,{x:s.x,y:e.y},e];
  return[s,{x:e.x,y:s.y},e];
}
function pathD(pts,r=9){
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y),rr=Math.min(r,l1/2,l2/2);
    const p1={x:b.x-(b.x-a.x)/l1*rr,y:b.y-(b.y-a.y)/l1*rr},p2={x:b.x+(c.x-b.x)/l2*rr,y:b.y+(c.y-b.y)/l2*rr};
    d+=` L${p1.x},${p1.y} Q${b.x},${b.y} ${p2.x},${p2.y}`;
  }
  const z=pts[pts.length-1];return d+` L${z.x},${z.y}`;
}

  const defs=el("defs",{},svg);
  [["mAr","var(--ink2)"],["mAl","var(--loop)"],["mAs","var(--sug-bd)"]].forEach(([id,col])=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:8,markerHeight:8,orient:"auto"},defs);const p=el("path",{d:"M0,0 L10,5 L0,10 z"},m);p.style.fill=col});
  const map={};f.nodes.forEach(n=>map[n.id]=n);
  (f.labels||[]).forEach(l=>{const t=el("text",{x:l.cx,y:l.y,"text-anchor":"middle",class:"lane"},svg);t.textContent=l.t});
  const eg=el("g",{},svg),ng=el("g",{},svg);
  f.edges.forEach(e=>{
    const a=map[e.f],b=map[e.t],s=portPt(a,e.fp,e.fo||0),en=portPt(b,e.tp,e.to||0);
    const pts=route(s,en,e.fp,e.tp,e.via);
    const loop=e.k==="loop",sug=loop?(a.src==="sug"||b.src==="sug"||e.k==="loop"&&(a.src==="sug"||b.src==="sug")):(e.k==="sug"||a.src==="sug"||b.src==="sug");
    const g=el("g",{class:"edge"+(loop?" loop":"")+(sug?" e-sug":""),"data-f":e.f,"data-t":e.t},eg);
    const p=el("path",{d:pathD(pts),"marker-end":`url(#${loop?"mAl":sug?"mAs":"mAr"})`},g);
    if(e.l){
      let bi=0,bl=-1;for(let i=0;i<pts.length-1;i++){const L=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);if(L>bl){bl=L;bi=i}}
      const mx=(pts[bi].x+pts[bi+1].x)/2,my=(pts[bi].y+pts[bi+1].y)/2,w=tw(e.l,"10.5px system-ui")+12;
      const lg=el("g",{class:"el"},g);el("rect",{x:mx-w/2,y:my-9,width:w,height:18,rx:9},lg);
      const t=el("text",{x:mx,y:my+3.5,"text-anchor":"middle"},lg);t.textContent=e.l;
    }
  });
  f.nodes.forEach(n=>drawNode(ng,n));
  applyNotes();
  if(selId)highlight(selId);
}
function drawNode(parent,n){
  const g=el("g",{class:`node t-${n.t} src-${n.src}`,"data-id":n.id,tabindex:0,role:"button","aria-label":n.l},parent);
  const x=n.cx-n.w/2,y=n.y,w=n.w,h=n.h;
  if(n.t==="dec")el("polygon",{points:`${n.cx},${y} ${x+w},${y+h/2} ${n.cx},${y+h} ${x},${y+h/2}`,class:"shape"},g);
  else el("rect",{x,y,width:w,height:h,rx:(n.t==="start"||n.t==="end")?h/2:10,class:"shape"},g);
  const maxW=n.t==="dec"?w*.56:w-(n.t==="start"||n.t==="end"?30:20);
  const ll=wrap(n.l,LF,maxW),sl=n.s?wrap(n.s,SF,maxW):[];
  const total=ll.length*16+sl.length*13+(sl.length?3:0);
  if(total>h-8)console.warn("TEXT OVERFLOW",n.id,total,h);
  let ty=y+h/2-total/2;
  ll.forEach(t=>{const e=el("text",{x:n.cx,y:ty+8,"text-anchor":"middle","dominant-baseline":"central",class:"lbl"},g);e.textContent=t;ty+=16});
  ty+=sl.length?3:0;
  sl.forEach(t=>{const e=el("text",{x:n.cx,y:ty+6.5,"text-anchor":"middle","dominant-baseline":"central",class:"sub"},g);e.textContent=t;ty+=13});
  const dec=n.t==="dec";
  if(n.src==="sug"){const tg=el("g",{class:"tag"},g),tx=dec?x+w*.08:x+8,ty2=dec?y+h/2-24:y-7;el("rect",{x:tx,y:ty2,width:30,height:14,rx:7},tg);const t=el("text",{x:tx+15,y:ty2+10,"text-anchor":"middle"},tg);t.textContent="NEW"}
  if(n.loop){const lg=el("g",{class:"lpb"},g),cx=dec?x+w*.92:x+w-6,cy=dec?y+h/2-14:y+2;el("circle",{cx,cy,r:9},lg);const t=el("text",{x:cx,y:cy+4,"text-anchor":"middle"},lg);t.textContent="↻"}
  g.addEventListener("click",()=>select(n.id));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(n.id)}});
}
function highlight(id){
  document.querySelectorAll(".node").forEach(g=>g.classList.toggle("sel",g.dataset.id===id));
  document.querySelectorAll(".edge").forEach(g=>g.classList.toggle("hi",g.dataset.f===id||g.dataset.t===id));
}
function select(id){selId=id;highlight(id);const n=FLOWS[cur].nodes.find(x=>x.id===id);panelNode(n)}

/* ---------- PANEL ---------- */
function panelDefault(){setSide(false)}
function panelMind(){setSide(false)}
function setSide(on){document.querySelector('aside').classList.toggle('hide',!on);document.querySelector('.wrap').classList.toggle('noside',!on)}
function panelNode(n){
  const tl={start:"Start",end:"End",proc:"Step",dec:"Decision",sys:"System / API",adm:"Admin set-up"}[n.t];
  let h=`<h3>${esc(n.l)}</h3><p>${n.src==="sug"?'<span class="badge b-sug">My suggestion</span>':`<span class="badge b-note">Your notes ${esc(n.p||"")}</span>`}<span class="badge b-note">${tl}</span>${n.loop?'<span class="badge b-loop">↻ loop</span>':""}</p>`;
  if(n.s)h+=`<p><i>${esc(n.s)}</i></p>`;
  h+=`<h4>What it means</h4><p>${esc(n.d||"")}</p>`;
  if(n.dev)h+=`<h4>Dev team to build</h4><ul>${n.dev.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(n.risk)h+=`<h4>Risk / loop</h4><ul>${n.risk.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(n.q)h+=`<div class="qbox"><b>Open question:</b> ${esc(n.q)}</div>`;
  if(n.go)h+=`<p style="margin-top:14px"><button class="btn pri" onclick="go('${n.go}')">Open ${n.go==="d2c"?"D2C":n.go==="b2b"?"B2B":"Admin set-up"} flow →</button></p>`;
  $("#panel").innerHTML=h;setSide(true);
}

/* ---------- MIND MAP ---------- */
let mmOpen=new Set();
function mmInit(n,d=0,path="r"){n._p=path;n._d=d;mmOpen.add(path);(n.c||[]).forEach((c,i)=>mmInit(c,d+1,path+"."+i))}
mmInit(MM);
function mmAll(open){mmOpen=new Set();(function r(n){if(open||n._d<2)mmOpen.add(n._p);(n.c||[]).forEach(r)})(MM);renderMind($("#main"))}
function renderMind(m){
  m.innerHTML=`<div class="intro"><h2>Mind map – scope at a glance</h2><p>Everything from your three notebook pages grouped by branch, with my suggestions on amber dashed leaves. Click a node to collapse / expand.</p></div>
  <div class="toolbar"><button class="btn" onclick="mmAll(true)">Expand all</button><button class="btn" onclick="mmAll(false)">Collapse to level 2</button><button class="btn" onclick="window.print()">Print / PDF</button></div><div class="canvas" id="canvas"></div>`;
  const rowH=34,colW=[0,230,220,260,260];let leaf=0;const pos=[];
  (function lay(n){n._open=mmOpen.has(n._p);n._w=Math.max(120,Math.ceil(tw(n.t,"12.5px system-ui"))+26)+(n.c?16:0);
    if(!n.c||!n._open){n._y=leaf*rowH;leaf++}else{n.c.forEach(lay);n._y=(n.c[0]._y+n.c[n.c.length-1]._y)/2}
    pos.push(n)})(MM);
  const xs=[10];const mw=[0,0,0,0,0];pos.forEach(n=>{mw[n._d]=Math.max(mw[n._d],n._w)});
  for(let i=1;i<5;i++)xs[i]=xs[i-1]+mw[i-1]+46;
  const W=xs[4]+mw[4]+20,H=leaf*rowH+20;
  const svg=el("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`},$("#canvas"));
  const lg=el("g",{},svg),ng=el("g",{},svg);
  (function draw(n){
    const x=xs[n._d],y=n._y+10,h=26;
    if(n.c&&n._open)n.c.forEach(c=>{const x2=xs[c._d],y2=c._y+10+h/2,x1=x+n._w,y1=y+h/2,mx=(x1+x2)/2;el("path",{d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,class:"mm-link"},lg);draw(c)});
    const g=el("g",{class:`mm-node d${Math.min(n._d,1)}${n.s?" sug":""}`},ng);
    el("rect",{x,y,width:n._w,height:h,rx:13},g);
    const t=el("text",{x:x+13,y:y+h/2+4.5},g);t.textContent=n.t;
    if(n.c){const p=el("text",{x:x+n._w-14,y:y+h/2+4,class:"pm"},g);p.textContent=n._open?"−":"+";if(n._d===0)p.style.fill="#fff"}
    if(n.c)g.addEventListener("click",()=>{if(mmOpen.has(n._p)){mmOpen.delete(n._p)}else mmOpen.add(n._p);renderMind($("#main"))});
  })(MM);
}

/* ---------- REVIEW ---------- */
function renderReview(m){
  let h=`<div class="card"><h3>How I read your handwriting (please correct me)</h3><ul class="hint" style="line-height:1.6">
   <li>"Form separate for cor + Edu" → one separate B2B registration form for Corporate and Edu.</li>
   <li>"Pending (default)" → new B2B accounts start as Pending until approved.</li>
   <li>"Account Manager → RFQ → offer price" → the Account Manager replies to an RFQ with an offer price.</li>
   <li>"Separate stock E-comms / Inventory" → e-commerce has its own stock bucket.</li>
   <li>"100 → 70" under "Acc separate price → Catalog" → account-specific price lower than list.</li>
   <li>"Robi + EBL + BRAC + UP" (circled) → first B2B accounts / pilot customers.</li>
   <li>"form → deli-ecom → email-config" → forms notify by email, configured in the deli-ecom admin.</li></ul></div>
  <div class="card"><h3>Loops & gaps found (${LOOPS.length})</h3>`;
  LOOPS.forEach(l=>{h+=`<div class="row"><div><span class="sev ${l.sev}">${l.sev}</span><div class="fl" style="margin-top:4px">${l.id} · ${l.fl}</div></div>
   <div><b>${esc(l.t)}</b><p>${esc(l.p)}</p><p><b>Suggested fix:</b> ${esc(l.f)}</p></div>
   <div><select data-dec="${l.id}"><option value="">– decide –</option><option>Accept</option><option>Discuss</option><option>Drop</option></select></div></div>`});
  h+=`</div><div class="card"><h3>Status models for the dev team</h3>`;
  STATES.forEach(s=>{h+=`<p><b>${s.n}</b></p><div class="chain">${s.s.map((x,i)=>`<span class="chip">${esc(x)}</span>${i<s.s.length-1?"→":""}`).join("")}</div><p class="fl">${esc(s.x)}</p>`});
  h+=`<p style="margin-top:10px"><b>Price precedence:</b> Offer price (RFQ) &gt; Account price list &gt; Default price.</p></div>
  <div class="card"><h3>Open questions (${QUESTIONS.length})</h3>`;
  QUESTIONS.forEach(q=>{h+=`<div class="qrow"><b>${q.id}.</b> ${esc(q.t)}<textarea data-ans="${q.id}" placeholder="Your answer…"></textarea></div>`});
  h+=`</div><div class="card noprint"><h3>Send to MIS team</h3><p>Downloads a Markdown summary with decisions, answers, state models and the loop list.</p><button class="btn pri" id="dl">Download summary (.md)</button> <button class="btn" id="cp">Copy to clipboard</button> <span id="cpm" class="fl"></span></div>`;
  m.innerHTML=h;
  m.querySelectorAll("[data-dec]").forEach(s=>{s.value=store.dec[s.dataset.dec]||"";s.onchange=()=>{store.dec[s.dataset.dec]=s.value;save()}});
  m.querySelectorAll("[data-ans]").forEach(t=>{t.value=store.ans[t.dataset.ans]||"";t.oninput=()=>{store.ans[t.dataset.ans]=t.value;save()}});
  $("#dl").onclick=()=>{const b=new Blob([summary()],{type:"text/markdown"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="deli-ecom-flow-summary.md";a.click()};
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(summary());$("#cpm").textContent="Copied"}catch(e){$("#cpm").textContent="Copy blocked – use Download"}};
}
function summary(){
  let s="# Deli E-commerce – D2C + B2B flow summary\n\nSource: handwritten notes (3 pages) + current admin panel. See the interactive flowchart HTML for diagrams.\n\n## Flow outline\n";
  ["d2c","b2b","admin"].forEach(k=>{s+=`\n### ${FLOWS[k].title}\n`;FLOWS[k].nodes.forEach(n=>{s+=`- ${n.l}${n.s?" – "+n.s:""}${n.src==="sug"?" **(suggested)**":""}\n`})});
  s+="\n## Loops & gaps\n";LOOPS.forEach(l=>{s+=`- **${l.id} [${l.sev}] ${l.t}** (${l.fl}) – ${l.p} Fix: ${l.f} → Decision: ${store.dec[l.id]||"pending"}\n`});
  s+="\n## Status models\n";STATES.forEach(x=>{s+=`- ${x.n}: ${x.s.join(" → ")} (${x.x})\n`});
  s+="\n- Price precedence: Offer price > Account price list > Default price\n\n## Open questions\n";
  QUESTIONS.forEach(q=>{s+=`- **${q.id}** ${q.t}\n  - Answer: ${store.ans[q.id]||"(open)"}\n`});
  return s;
}
window.addEventListener("resize",()=>{if(fitMode&&FLOWS[cur]&&$("#canvas"))drawFlow()});
buildTabs();render();
